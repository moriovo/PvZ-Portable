name: Build PvZ-Portable for Nintendo Switch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-switch:
    name: Build Switch NRO
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build libopenmpt for Switch
        shell: bash
        run: |
          set -euxo pipefail
          source "$DEVKITPRO/switchvars.sh"
          OPENMPT_TAG="$(git ls-remote --tags https://github.com/OpenMPT/openmpt.git 'refs/tags/libopenmpt-*' \
            | sed 's|.*refs/tags/libopenmpt-||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -z "$OPENMPT_TAG" ]; then OPENMPT_TAG="0.8.4"; fi
          git clone --depth=1 --branch "libopenmpt-${OPENMPT_TAG}" https://github.com/OpenMPT/openmpt.git openmpt
          make -C openmpt CONFIG=gcc SHARED_LIB=0 DYNLINK=0 EXAMPLES=0 OPENMPT123=0 TEST=0 -j"$(nproc)"
          make -C openmpt CONFIG=gcc SHARED_LIB=0 DYNLINK=0 EXAMPLES=0 OPENMPT123=0 TEST=0 PREFIX="$PORTLIBS_PREFIX" install

      - name: Configure and compile NRO
        shell: bash
        run: |
          set -euxo pipefail
          source "$DEVKITPRO/switchvars.sh"
          aarch64-none-elf-cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE=-O2
          cmake --build build --parallel "$(nproc)"
          aarch64-none-elf-strip build/pvz-portable.elf
          test -s build/pvz-portable.nro

      - name: Upload Switch build
        uses: actions/upload-artifact@v4
        with:
          name: pvz-portable-switch
          path: |
            build/pvz-portable.nro
            build/pvz-portable.elf
          if-no-files-found: error
